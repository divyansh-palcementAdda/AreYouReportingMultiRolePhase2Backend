spring.application.name=AreYouReporting


# ==============================================
# Database Configuration (MySQL)
# ==============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/AreYouReporting?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
#spring.datasource.password=${DB_PASSWORD:RcefRoot@2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000          
# 10 minutes
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=1800000        
 # 30 minutes
spring.datasource.hikari.connection-timeout=30000     
# 30 seconds
spring.jackson.time-zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# ==============================================
# Hibernate / JPA
# ==============================================
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
#logging.level.com.renaissance.app=DEBUG


# ==============================================
# Mail Configuration (Google Workspace / Gmail SMTP)
# ==============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:chancelloroffice@renaissance.ac.in}
spring.mail.password=${MAIL_PASSWORD:}
    # Use an App Password, NOT your real Gmail password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Mail Logging
logging.level.org.springframework.mail=DEBUG

# ==============================================
# JWT Configuration
# ==============================================
jwt.secret=${JWT_SECRET:2x9zV7kQyt8qEktJBSzGeJKaVzMeEVFkh0FcogLPBQzX8p2mW3nY5tR7uC9vA1bD4eF6gH8iJ0kL2mN4oP6qR8sT0uV2wX4yZ6aB8cD0eF2gH4iJ6k}
jwt.expiration=8640000
# 24 hours
jwt.refresh.expiration=604800000
# 7 days

# ==============================================
# Password Reset OTP Configuration
# ==============================================
password.reset.otp.expiry-minutes=10
password.reset.otp.max-attempts=5
password.reset.otp.resend-cooldown-seconds=30

# ==============================================
# Google Drive Integration
# ==============================================
gdrive.credentials.json=${GDRIVE_CREDENTIALS_JSON:}
gdrive.credentials.base64=${GDRIVE_CREDENTIALS_BASE64:}
gdrive.credentials.path=${GDRIVE_CREDENTIALS_PATH:classpath:service-account-key.json}
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID:1Zwh76W-7mclbIyN-7d1bpwb7kCilFQsE}
# ==============================================
# Google OAuth2 (for user login)
# ==============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=https://www.googleapis.com/auth/drive.file,profile,email

# ==============================================
# Multipart (File Upload)
# ==============================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# ==============================================
# Logging
# ==============================================
#logging.level.org.springframework=INFO
#logging.level.org.hibernate.SQL=INFO
#logging.level.org.hibernate.orm.jdbc.bind=INFO

# Turn off SQL query logs
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.scheduling=DEBUG
# Turn off formatting logs
logging.level.org.hibernate.sql=OFF
logging.level.org.hibernate=INFO
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR


# ==============================================
# Server Config
# ==============================================
server.port=8080
server.address=0.0.0.0
#http://192.168.0.1/index.html tenda page

# ==============================================
# Kafka
# ==============================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.group-id=notifications-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ==============================================
# CMS Integration Config
# ==============================================
cms.backend.url=${CMS_BACKEND_URL:https://cms.areyoureporting.com}
cms.integration.api.key=${CMS_INTEGRATION_API_KEY:default-integration-dev-key}
integration.api.key=${INTEGRATION_API_KEY:}

